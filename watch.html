<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ani-lite player</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header><h1>player</h1><a href="index.html">library</a></header>
<div class="row">
<label>Entry<br><select id="entry"></select></label>
<label>Quality<br><select id="quality"><option value="">default 480p</option></select></label>
</div>
<video id="v" controls preload="none" playsinline></video>
<p class="meta" id="pos"></p>
<div class="row">
<button id="resume">Resume</button>
<button id="clear">Clear progress</button>
</div>
<p class="meta">HLS (.m3u8) uses native playback if your TV supports it, else loads hls.js on demand. No transcoding.</p>
</body>
</html>
